<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account - HomeFix</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<header>

    <div class="container navbar">

        <a href="index.html" class="logo">
            <span class="logo-mark">H</span>
            HomeFix
        </a>


        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="services.html">Services</a>

            <a href="login.html">Login</a>

        </nav>

    </div>

</header>



<main class="auth-page">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Join HomeFix and book services easily.
        </p>


        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="signupName"
                class="form-control"
                placeholder="Enter your name">

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="signupEmail"
                class="form-control"
                placeholder="Enter your email">

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                class="form-control"
                placeholder="Minimum 6 characters">

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="signupConfirmPassword"
                class="form-control"
                placeholder="Re-enter your password">

        </div>


        <button
            class="auth-button"
            onclick="signupUser()">

            Create Account

        </button>


        <p
            id="signupMessage"
            class="auth-message">
        </p>


        <div class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>



<footer>

    <div class="container footer-content">

        <div>

            <div class="footer-logo">
                🏠 HomeFix
            </div>

            <p>
                Simple, convenient home service booking.
            </p>

        </div>


        <div>

            <h3>Contact</h3>

            <p>📧 support@homefix.com</p>

            <p>📞 +91 98765 43210</p>

        </div>


        <div>

            <h3>Location</h3>

            <p>
                Andhra Pradesh, India
            </p>

        </div>

    </div>


    <div class="footer-bottom">
        © 2026 HomeFix
    </div>

</footer>


<script src="script.js"></script>

</body>

</html>
